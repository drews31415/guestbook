# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontainer-16

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crlim16.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_5C2EB638589D4D9E8553C65C31F615DF }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_B0EC6CF3A0C84872B166EB91AE0ABD28 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crlim16.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_5C2EB638589D4D9E8553C65C31F615DF }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontainer-16'
          slot-name: 'staging'
          images: 'crlim16.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_5C2EB638589D4D9E8553C65C31F615DF }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F3B2061C820E41EEBC99BFB5583124B4 }}